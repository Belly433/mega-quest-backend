name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: megaquest_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check app starts correctly
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/megaquest_test
        run: python -c "from app.main import app; print('✅ App loaded successfully')"

      - name: Verify API routes are registered
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/megaquest_test
        run: |
          python -c "
          from app.main import app
          routes = [r.path for r in app.routes]
          assert '/auth/login' in routes, 'auth routes missing'
          assert '/session/create' in routes, 'session routes missing'
          assert '/anti-cheat/{pin}/suspicious_activity' in routes, 'anti-cheat routes missing'
          print('✅ All critical routes present:', routes)
          "
